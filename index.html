<style>
  :root{
    --bg: #0c0e12;
    --panel: #14171d;
    --panel-2: #1a1e26;
    --line: #262b34;
    --text: #e7e9ee;
    --muted: #7d8492;
    --tr: #d98a3c;
    --tr-dim: rgba(217,138,60,.14);
    --ct: #5b8dd9;
    --ct-dim: rgba(91,141,217,.14);
    --gold: #e8c15a;
    --danger: #c9584f;
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.disp{font-family:'Rajdhani',sans-serif; letter-spacing:.03em; text-transform:uppercase;}
  .app{max-width:980px; margin:0 auto; padding:18px 16px 60px;}

  header{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px;}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--gold); box-shadow:0 0 10px var(--gold);}
  .brand h1{font-size:22px; margin:0; font-weight:700;}
  .brand span{color:var(--muted); font-size:11px; letter-spacing:.12em; display:block; font-family:'Inter'; text-transform:uppercase;}
  .total-pill{background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:6px 14px; font-size:13px; color:var(--muted); font-family:'Inter';}
  .total-pill b{color:var(--gold); font-weight:600;}

  .searchbar{position:relative; margin-bottom:14px;}
  .searchbar input{
    width:100%; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:13px 44px 13px 16px; color:var(--text); font-size:15px; font-family:'Inter'; outline:none;
    transition:border-color .15s;
  }
  .searchbar input:focus{border-color:var(--gold);}
  .searchbar kbd{
    position:absolute; right:12px; top:50%; transform:translateY(-50%);
    font-size:11px; color:var(--muted); border:1px solid var(--line); border-radius:5px; padding:2px 6px;
    font-family:'Inter'; pointer-events:none;
  }

  .filters{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;}
  .chip{
    display:inline-flex; align-items:center; gap:8px;
    background:var(--panel); border:1px solid var(--line); color:var(--muted);
    padding:8px 16px; border-radius:999px; font-size:12.5px; cursor:pointer; font-family:'Rajdhani';
    font-weight:600; letter-spacing:.04em; text-transform:uppercase; transition:.15s;
  }
  .chip svg{width:26px; height:26px;}
  .chip img{width:26px; height:26px; border-radius:5px; vertical-align:middle; object-fit:contain;}
  .chip:hover{border-color:#3a4150;}
  .chip.active{background:var(--gold); color:#1a1608; border-color:var(--gold);}
  .chip.side-tr.active{background:var(--tr); color:#221305; border-color:var(--tr);}
  .chip.side-ct.active{background:var(--ct); color:#0b1a30; border-color:var(--ct);}
  .chip.cat-active{color:#0c0e12; border-color:transparent;}
  .filter-label{color:var(--muted); font-size:10.5px; font-family:'Rajdhani'; font-weight:700; letter-spacing:.1em; margin:10px 0 6px;}

  .mapgrid{display:grid; grid-template-columns:repeat(auto-fill, minmax(210px,1fr)); gap:12px; margin-bottom:8px;}
  .mapcard{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; cursor:pointer; transition:.15s; position:relative; overflow:hidden;
  }
  .mapcard:hover{border-color:var(--gold); transform:translateY(-1px);}
  .mapcard .icon{display:block; width:68px; height:68px; border-radius:14px; overflow:hidden; margin-bottom:10px;}
  .mapcard .icon svg{width:68px; height:68px; display:block;}
  .mapcard .icon img{display:block; width:68px; height:68px;}
  .mapcard h3{margin:0 0 4px; font-size:19px;}
  .mapcard .count{color:var(--muted); font-size:12px; font-family:'Inter';}

  .backbtn{background:none; border:none; color:var(--muted); font-family:'Rajdhani'; font-weight:600;
    text-transform:uppercase; font-size:13px; letter-spacing:.05em; cursor:pointer; margin-bottom:14px; padding:0;}
  .backbtn:hover{color:var(--gold);}
  .map-title{display:flex; align-items:center; gap:16px; margin:0 0 18px;}
  .map-title .icon{display:block; width:96px; height:96px; border-radius:16px; overflow:hidden; flex:none;}
  .map-title .icon svg{width:96px; height:96px; display:block;}
  .map-title .icon img{display:block; width:96px; height:96px;}
  .map-title h2{margin:0; font-size:30px;}

  .section-title{display:flex; align-items:center; gap:10px; margin:22px 0 10px; padding:9px 14px; border-radius:8px; cursor:pointer; user-select:none;}
  .section-title .chevron{margin-left:4px; transition:transform .18s; flex:none; color:var(--muted); font-size:14px;}
  .section-title.collapsed .chevron{transform:rotate(-90deg);}
  .section-title .cat-icon{width:52px; height:52px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex:none;}
  .section-title .cat-icon svg{width:36px; height:36px;}
  .section-title .cat-icon img{width:52px; height:52px; border-radius:10px; object-fit:cover;}
  .section-title h2{margin:0; font-size:15px; font-weight:700; letter-spacing:.04em;}
  .section-title .count-tag{margin-left:auto; font-family:'Inter'; font-size:11px; color:var(--muted);}

  .card{
    display:flex; align-items:center; gap:12px; background:var(--panel); border:1px solid var(--line);
    border-left:4px solid var(--line); border-radius:var(--radius); padding:12px 14px; margin-bottom:8px; transition:.12s;
  }
  .card:hover{border-color:#3a4150;}
  .side-tag{
    flex:none; font-family:'Rajdhani'; font-weight:700; font-size:11px; letter-spacing:.05em;
    padding:4px 9px; border-radius:5px;
  }
  .side-tag.tr{background:var(--tr-dim); color:var(--tr);}
  .side-tag.ct{background:var(--ct-dim); color:var(--ct);}
  .cat-badge{flex:none; width:52px; height:52px; border-radius:10px; display:flex; align-items:center; justify-content:center; overflow:hidden;}
  .cat-badge svg{width:36px; height:36px;}
  .cat-badge img{width:52px; height:52px; object-fit:cover;}
  .card-body{flex:1; min-width:0;}
  .card-name{font-size:14.5px; font-weight:500; display:flex; align-items:center; gap:6px;}
  .card-name a{color:var(--text); text-decoration:none;}
  .card-name a:hover{color:var(--gold); text-decoration:underline;}
  .star{color:var(--gold); font-size:12px;}
  .card-meta{color:var(--muted); font-size:11.5px; margin-top:2px; font-family:'Inter';}
  .delbtn{flex:none; background:none; border:none; color:var(--muted); cursor:pointer; font-size:15px; opacity:.5; padding:2px 4px;}
  .delbtn:hover{opacity:1; color:var(--danger);}

  .empty{color:var(--muted); font-size:13px; padding:20px 0; text-align:center; font-family:'Inter';}

  .gallery{display:grid; grid-template-columns:repeat(auto-fill, minmax(120px,1fr)); gap:8px; margin:10px 0 18px;}
  .gallery img{width:100%; border-radius:8px; border:1px solid var(--line); cursor:zoom-in;}

  .lightbox{position:fixed; inset:0; background:rgba(6,7,9,.94); z-index:1000; display:flex; align-items:center; justify-content:center; cursor:zoom-out; padding:24px;}
  .lightbox.hidden{display:none;}
  .lightbox img{max-width:94vw; max-height:94vh; border-radius:8px; box-shadow:0 10px 40px rgba(0,0,0,.5);}
  .lightbox .lb-close{position:absolute; top:18px; right:22px; color:var(--muted); font-family:'Rajdhani'; font-size:13px; letter-spacing:.08em; text-transform:uppercase; font-weight:700;}

  .icon-btn{
    background:var(--panel); border:1px solid var(--line); color:var(--muted); border-radius:999px;
    padding:6px 13px; font-size:12px; font-family:'Rajdhani'; font-weight:600; letter-spacing:.04em;
    text-transform:uppercase; cursor:pointer; display:inline-flex; align-items:center; gap:6px;
  }
  .icon-btn:hover{border-color:var(--gold); color:var(--gold);}

  .icon-panel-overlay{position:fixed; inset:0; background:rgba(6,7,9,.85); z-index:900; display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; overflow-y:auto;}
  .icon-panel-overlay.hidden{display:none;}
  .icon-panel{background:var(--panel); border:1px solid var(--line); border-radius:14px; max-width:640px; width:100%; padding:22px;}
  .icon-panel h2{margin:0 0 4px; font-size:20px;}
  .icon-panel .sub{color:var(--muted); font-size:12.5px; font-family:'Inter'; margin-bottom:18px;}
  .icon-panel .close-x{float:right; background:none; border:none; color:var(--muted); font-size:20px; cursor:pointer; line-height:1;}
  .icon-panel .grp-label{color:var(--muted); font-size:10.5px; font-family:'Rajdhani'; font-weight:700; letter-spacing:.1em; margin:16px 0 8px;}
  .icon-row{display:flex; align-items:center; gap:12px; padding:8px 0; border-bottom:1px solid var(--line);}
  .icon-row .preview{width:40px; height:40px; border-radius:9px; overflow:hidden; flex:none; background:var(--panel-2); display:flex; align-items:center; justify-content:center;}
  .icon-row .preview svg, .icon-row .preview img{width:100%; height:100%; object-fit:cover;}
  .icon-row .name{flex:1; font-size:13.5px; font-family:'Inter';}
  .icon-row .row-actions{display:flex; gap:6px; flex:none;}
  .icon-row button{background:var(--panel-2); border:1px solid var(--line); color:var(--muted); border-radius:6px; padding:6px 10px; font-size:11px; font-family:'Rajdhani'; font-weight:700; text-transform:uppercase; letter-spacing:.03em; cursor:pointer;}
  .icon-row button:hover{color:var(--gold); border-color:var(--gold);}
  .icon-row button.reset{color:var(--danger);}

  .addbox{background:var(--panel-2); border:1px dashed var(--line); border-radius:var(--radius); padding:14px; margin-top:18px;}
  .addbox summary{cursor:pointer; color:var(--gold); font-family:'Rajdhani'; font-weight:600; font-size:13px; letter-spacing:.05em; text-transform:uppercase;}
  .addform{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px;}
  .addform input, .addform select{
    background:var(--panel); border:1px solid var(--line); border-radius:7px; padding:9px 10px; color:var(--text); font-size:13px; font-family:'Inter';
  }
  .addform input:focus, .addform select:focus{outline:none; border-color:var(--gold);}
  .addform .full{grid-column:1/-1;}
  .addform button{
    grid-column:1/-1; background:var(--gold); border:none; border-radius:7px; padding:10px; color:#1a1608;
    font-family:'Rajdhani'; font-weight:700; text-transform:uppercase; letter-spacing:.05em; cursor:pointer; font-size:13px;
  }

  .novas-item{display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:10px 12px; margin-bottom:7px; flex-wrap:wrap;}
  .novas-item a{color:var(--muted); font-size:12.5px; word-break:break-all; flex:1; min-width:160px; text-decoration:none;}
  .novas-item a:hover{color:var(--text);}
  .novas-item select, .novas-item input[type=text]{background:var(--panel-2); border:1px solid var(--line); color:var(--text); border-radius:6px; padding:5px 7px; font-size:12px;}
  .novas-item button{flex:none; background:var(--gold); border:none; border-radius:6px; padding:6px 10px; color:#1a1608; font-family:'Rajdhani'; font-weight:700; font-size:11px; cursor:pointer;}

  @media(max-width:520px){
    .addform{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="lightbox hidden" id="lightbox"><span class="lb-close">Fechar ✕</span><img id="lightbox-img" src=""></div>
<div class="icon-panel-overlay hidden" id="icon-panel-overlay">
  <div class="icon-panel">
    <button class="close-x" id="close-icon-panel">✕</button>
    <h2>Personalizar ícones</h2>
    <div class="sub">Escolha um arquivo de imagem do seu computador pra cada ícone. Fica salvo só no seu navegador — eu (Claude) não vejo nem armazeno essas imagens.</div>
    <div id="icon-panel-body"></div>
  </div>
</div>
<input type="file" id="icon-file-input" accept="image/*" style="display:none;">

<script>
/* ===================== ÍCONES DE MAPA (ilustrações originais, não são arte da Valve) ===================== */
/* ===================== ÍCONES DE MAPA =====================

   ou cole o SVG direto no lugar do `<svg...>...</svg>`,

   (salvando mirage.png, inferno.png etc. numa pasta "icons" ao lado deste arquivo .html)
================================================================= */
/* =====================================================================
   ÍCONES FINAIS (hospedados por você) — cole os links aqui quando tiver.
   Preenchido = usa a imagem sua. Vazio ('') = usa o desenho padrão.
   Ex: mirage: 'https://i.imgur.com/xxxxx.png'
   ===================================================================== */

const MAP_ICONS = {

/* ===================== CATEGORIAS: ícone + cor pra diferenciar de relance ===================== */
/* ===================== CATEGORIAS: ícone + cor pra diferenciar de relance =====================
   PRA TROCAR O ÍCONE POR UM SEU:
   Opção A (você tem o código SVG do ícone): troque todo o conteúdo entre as crases `...`
     do campo "icon" abaixo pelo SVG dele (mantenha as crases).
   Opção B (você só tem um arquivo .png/.svg): troque o campo "icon" por:
     `<img src="icons/smoke.png" style="width:100%;height:100%;object-fit:contain;">`
     e salve o arquivo "smoke.png" numa pasta chamada "icons" ao lado deste .html
     (mesma pasta, senão a imagem não aparece). Repita pra flash.png, molotov.png, he.png, combo.png.
================================================================================================ */
const CAT_ORDER = ['smoke','flash','molotov','he','combo'];

}

/* ===================== GALERIA DE PRINTS (aguardando upload do usuário) ===================== */
const GALLERY = {
  mirage: [
    {src:'https://raw.githubusercontent.com/matarindofocono33/nades-icones/main/mirage-spawns-1-6.jpg', caption:'Spawns #1 a #6 - referência de jumpthrow'},
    {src:'https://raw.githubusercontent.com/matarindofocono33/nades-icones/main/mirage-spawns-7-12.jpg', caption:'Spawns #7 a #12 - referência de jumpthrow'},
  ],
};

/* ===================== ESTADO ===================== */
let state = { view:'home', map:null, query:'', side:'all', cat:'all', extra:[], novasQueue:[...NOVAS], customIcons:{}, iconPanelOpen:false, collapsedCats:new Set() };

function getMapIconHtml(id, sizePx){
  const s = sizePx ? `width:${sizePx}px;height:${sizePx}px;` : 'width:100%;height:100%;';
  if(ICON_URLS.maps[id]) return `<img src="${ICON_URLS.maps[id]}" style="${s}object-fit:cover;border-radius:8px;">`;
  const custom = state.customIcons['map:'+id];
  return custom ? `<img src="${custom}" style="${s}object-fit:cover;border-radius:8px;">` : MAP_ICONS[id];
}
function getSideIconHtml(side, sizePx){
  if(!ICON_URLS.sides[side]) return '';
  return `<img src="${ICON_URLS.sides[side]}" style="width:${sizePx}px;height:${sizePx}px;object-fit:contain;border-radius:4px;vertical-align:middle;margin-right:4px;">`;
}
function getCatIconHtml(id, sizePx){
  const s = sizePx ? `width:${sizePx}px;height:${sizePx}px;` : 'width:100%;height:100%;';
  if(ICON_URLS.cats[id]) return `<img src="${ICON_URLS.cats[id]}" style="${s}object-fit:contain;">`;
  const custom = state.customIcons['cat:'+id];
  return custom ? `<img src="${custom}" style="${s}object-fit:contain;">` : CAT_META[id].icon;
}

async function loadState(){
  try{
    const r = await window.storage.get('nades-cs2-state');
    if(r && r.value){
      const saved = JSON.parse(r.value);
      state.extra = saved.extra || [];
      state.novasQueue = saved.novasQueue || [...NOVAS];
    }
  }catch(e){ /* primeira vez, sem dado salvo ainda */ }
  try{
    const ri = await window.storage.get('nades-cs2-icons');
    if(ri && ri.value){ state.customIcons = JSON.parse(ri.value); }
  }catch(e){ /* sem ícones customizados ainda */ }
  render();
}
async function saveState(){
  try{
    await window.storage.set('nades-cs2-state', JSON.stringify({extra:state.extra, novasQueue:state.novasQueue}));
  }catch(e){ console.error('Falha ao salvar', e); }
}
async function saveIcons(){
  try{
    await window.storage.set('nades-cs2-icons', JSON.stringify(state.customIcons));
  }catch(e){ console.error('Falha ao salvar ícones', e); }
}

function allNades(){ return NADES.concat(state.extra); }

const app = document.getElementById('app');
let html = '';

function render(){
  if(state.view==='home') renderHome();
  else renderMap(state.map);
}

function renderHeader(){
  const p = allNades().length;
  return `
  <header>
    <div class="brand">
      <div class="dot"></div>
      <div>
        <h1>DOCS V2</h1>
        <span>Professional Support</span>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap:8px;">
      <div class="total-pill"><b>${p}</b> granadas cadastradas</div>
    </div>
  </header>`;
}

function renderSearch(){
  return `
  <div class="searchbar">
    <input id="search" type="text" placeholder="Buscar granada, mapa, local... (ex: banana, exec b, retake)" value="${escapeHtml(state.query)}">
    <kbd>/</kbd>
  </div>`;
}

function renderHome(){
  const all = allNades();
  html = renderHeader();
  html += renderSearch();

  if(state.query.trim()){
    html += searchResultsHtml(all);
    app.innerHTML = html;
    bindGlobal();
    return;
  }

  html += `<div class="mapgrid">`;
  MAPS.forEach(m=>{
    const count = all.filter(x=>x.map===m.id).length;
    const novasCount = state.novasQueue.filter(x=>x.map===m.id).length;
    html += `
    <div class="mapcard" data-map="${m.id}">
      <span class="icon">${getMapIconHtml(m.id)}</span>
      <h3>${m.name}</h3>
      <div class="count">${count} granadas</div>
    </div>`;
  });
  html += `</div>`;
  app.innerHTML = html;
  bindGlobal();
  document.querySelectorAll('.mapcard').forEach(el=>{
    el.addEventListener('click', ()=>{ state.view='map'; state.map=el.dataset.map; state.cat='all'; state.side='all'; state.query=''; state.collapsedCats=new Set(); render(); });
  });
}

function searchResultsHtml(all){
  const q = state.query.trim().toLowerCase();
  const results = all.filter(x => (x.name+' '+x.map).toLowerCase().includes(q));
  let h = `<div class="section-title"><h2>Resultados (${results.length})</h2><div class="line"></div></div>`;
  h += results.length ? results.map(cardHtml).join('') : `<div class="empty">Nada encontrado pra "${escapeHtml(state.query)}"</div>`;
  return h;
}

function catBadge(cat){
  const meta = CAT_META[cat];
  return `<span class="cat-badge" style="background:${meta.color}22; color:${meta.color};">${getCatIconHtml(cat)}</span>`;
}

function cardHtml(x){
  const meta = CAT_META[x.cat];
  return `
  <div class="card" data-id="${x.id}" style="border-left-color:${meta.color}; background:linear-gradient(90deg, ${meta.color}14, var(--panel) 18%);">
    ${catBadge(x.cat)}
    <span class="side-tag ${x.side}">${getSideIconHtml(x.side,26)}${x.side.toUpperCase()}</span>
    <div class="card-body">
      <div class="card-name">${x.essential?'<span class="star">★</span>':''}<a href="${x.url}" target="_blank" rel="noopener">${escapeHtml(x.name)}</a></div>
      <div class="card-meta">${MAPS.find(m=>m.id===x.map)?.name || x.map} · ${meta.label}</div>
    </div>
    ${x.custom ? `<button class="delbtn" data-del="${x.id}" title="Remover">✕</button>` : ''}
  </div>`;
}

function renderMap(mapId){
  const m = MAPS.find(x=>x.id===mapId);
  const all = allNades().filter(x=>x.map===mapId);
  const novas = state.novasQueue.filter(x=>x.map===mapId);
  const gallery = GALLERY[mapId] || [];

  html = renderHeader();
  html += `<button class="backbtn" id="back">← Todos os mapas</button>`;
  html += renderSearch();

  if(state.query.trim()){
    html += searchResultsHtml(allNades());
    app.innerHTML = html;
    bindGlobal();
    document.getElementById('back').addEventListener('click', ()=>{ state.view='home'; state.query=''; render(); });
    return;
  }

  html += `<div class="map-title"><span class="icon">${getMapIconHtml(mapId)}</span><h2>${m.name}</h2></div>`;

  if(gallery.length){
    html += `<div class="section-title"><h2>Prints de referência</h2><div class="line"></div></div>`;
    html += `<div class="gallery">${gallery.map((g,i)=>`<img src="${g.src}" alt="${escapeHtml(g.caption||'')}" title="${escapeHtml(g.caption||'')}" data-lightbox="${mapId}:${i}">`).join('')}</div>`;
  }

  html += `<div class="filter-label">Lado</div>`;
  html += `<div class="filters">
    <div class="chip ${state.side==='all'?'active':''}" data-side="all">Todos</div>
    <div class="chip side-tr ${state.side==='tr'?'active':''}" data-side="tr">${getSideIconHtml('tr',26)}TR</div>
    <div class="chip side-ct ${state.side==='ct'?'active':''}" data-side="ct">${getSideIconHtml('ct',26)}CT</div>
  </div>`;

  html += `<div class="filter-label">Categoria</div>`;
  html += `<div class="filters">
    <div class="chip ${state.cat==='all'?'active':''}" data-cat="all">Todas</div>
    ${CAT_ORDER.map(c=>`<div class="chip ${state.cat===c?'cat-active active':''}" data-cat="${c}" style="${state.cat===c?`background:${CAT_META[c].color};`:''}">${getCatIconHtml(c,26)}${CAT_META[c].label}</div>`).join('')}
  </div>`;

  const filtered = all.filter(x => (state.side==='all' || x.side===state.side) && (state.cat==='all' || x.cat===state.cat));

  const catsToShow = state.cat==='all' ? CAT_ORDER : [state.cat];
  let any = false;
  catsToShow.forEach(cat=>{
    const items = filtered.filter(x=>x.cat===cat);
    if(!items.length) return;
    any = true;
    const isCollapsed = state.collapsedCats.has(cat);
    html += `<div class="section-title ${isCollapsed?'collapsed':''}" data-toggle-cat="${cat}" style="background:${CAT_META[cat].color}1c; border:1px solid ${CAT_META[cat].color}40;"><span class="cat-icon" style="background:${CAT_META[cat].color}; color:#1a1608;">${getCatIconHtml(cat)}</span><h2 style="color:${CAT_META[cat].color};">${CAT_META[cat].label}</h2><span class="count-tag">${items.length}</span><span class="chevron">▾</span></div>`;
    if(!isCollapsed){
      html += items.map(cardHtml).join('');
    }
  });
  if(!any){
    html += `<div class="empty">Nenhuma granada cadastrada com esse filtro ainda.</div>`;
  }

  if(novas.length){
    const isNovasCollapsed = state.collapsedCats.has('_novas');
    html += `<div class="section-title ${isNovasCollapsed?'collapsed':''}" data-toggle-cat="_novas" style="background:${'#e8c15a'}1c; border:1px solid ${'#e8c15a'}40;"><span class="cat-icon" style="background:var(--gold); color:#1a1608; font-size:16px;">🆕</span><h2 style="color:var(--gold);">Novas — a categorizar</h2><span class="count-tag">${novas.length}</span><span class="chevron">▾</span></div>`;
    if(!isNovasCollapsed){
      html += novas.map(nv=>`
        <div class="novas-item" data-nid="${nv.id}">
          <a href="${nv.url}" target="_blank" rel="noopener">${nv.url}</a>
          <select class="nv-side">
            <option value="tr">TR</option>
            <option value="ct">CT</option>
          </select>
          <select class="nv-cat">
            ${CAT_ORDER.map(c=>`<option value="${c}">${CAT_META[c].label}</option>`).join('')}
          </select>
          <input type="text" class="nv-name" placeholder="Nome da granada">
          <button data-promote="${nv.id}">Salvar</button>
        </div>`).join('');
    }
  }

  html += `
  <details class="addbox">
    <summary>+ Adicionar granada manualmente</summary>
    <div class="addform">
      <select id="af-side"><option value="tr">TR</option><option value="ct">CT</option></select>
      <select id="af-cat">${CAT_ORDER.map(c=>`<option value="${c}">${CAT_META[c].label}</option>`).join('')}</select>
      <input class="full" id="af-name" type="text" placeholder="Nome (ex: Exec B rápida)">
      <input class="full" id="af-url" type="text" placeholder="Link (YouTube, Facebook, etc)">
      <button id="af-submit">Adicionar</button>
    </div>
  </details>`;

  app.innerHTML = html;
  bindGlobal();

  document.getElementById('back').addEventListener('click', ()=>{ state.view='home'; render(); });
  document.querySelectorAll('[data-side]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.side = el.dataset.side; render(); });
  });
  document.querySelectorAll('[data-cat]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.cat = el.dataset.cat; render(); });
  });
  document.querySelectorAll('[data-toggle-cat]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const cat = el.dataset.toggleCat;
      if(state.collapsedCats.has(cat)) state.collapsedCats.delete(cat);
      else state.collapsedCats.add(cat);
      render();
    });
  });
  document.querySelectorAll('[data-promote]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const nid = btn.dataset.promote;
      const item = state.novasQueue.find(x=>x.id===nid);
      const wrap = btn.closest('.novas-item');
      const side = wrap.querySelector('.nv-side').value;
      const cat = wrap.querySelector('.nv-cat').value;
      const name = wrap.querySelector('.nv-name').value.trim() || 'Sem nome';
      state.extra.push({id:'x'+Date.now(), map:item.map, side, cat, name, url:item.url, essential:false, custom:true});
      state.novasQueue = state.novasQueue.filter(x=>x.id!==nid);
      saveState(); render();
    });
  });
  const submitBtn = document.getElementById('af-submit');
  if(submitBtn){
    submitBtn.addEventListener('click', ()=>{
      const side = document.getElementById('af-side').value;
      const cat = document.getElementById('af-cat').value;
      const name = document.getElementById('af-name').value.trim();
      const url = document.getElementById('af-url').value.trim();
      if(!name || !url) return;
      state.extra.push({id:'x'+Date.now(), map:mapId, side, cat, name, url, essential:false, custom:true});
      saveState(); render();
    });
  }
}

function bindGlobal(){
  const search = document.getElementById('search');
  if(search){
    search.addEventListener('input', ()=>{
      state.query = search.value;
      render();
      setTimeout(()=>{ const s=document.getElementById('search'); if(s){ s.focus(); s.setSelectionRange(s.value.length,s.value.length);} },0);
    });
  }
  document.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.del;
      state.extra = state.extra.filter(x=>x.id!==id);
      saveState(); render();
    });
  });
  document.querySelectorAll('[data-lightbox]').forEach(img=>{
    img.addEventListener('click', ()=>{
      const [mapId, idx] = img.dataset.lightbox.split(':');
      const src = GALLERY[mapId][+idx].src;
      const lb = document.getElementById('lightbox');
      document.getElementById('lightbox-img').src = src;
      lb.classList.remove('hidden');
    });
  });
  const openBtn = document.getElementById('open-icon-panel');
  if(openBtn) openBtn.addEventListener('click', openIconPanel);
}

const lightboxEl = document.getElementById('lightbox');
lightboxEl.addEventListener('click', ()=> lightboxEl.classList.add('hidden'));
document.addEventListener('keydown', (e)=>{
  if(e.key==='Escape'){ lightboxEl.classList.add('hidden'); closeIconPanel(); }
});

/* ===================== PAINEL DE PERSONALIZAÇÃO DE ÍCONES ===================== */
let pendingIconKey = null;
const iconPanelOverlay = document.getElementById('icon-panel-overlay');
const iconFileInput = document.getElementById('icon-file-input');

function renderIconPanel(){
  const body = document.getElementById('icon-panel-body');
  let h = `<div class="grp-label">Categorias de granada</div>`;
  CAT_ORDER.forEach(c=>{
    const key = 'cat:'+c;
    const hasCustom = !!state.customIcons[key];
    h += `
    <div class="icon-row">
      <div class="preview">${getCatIconHtml(c,40)}</div>
      <div class="name">${CAT_META[c].label}</div>
      <div class="row-actions">
        <button data-choose="${key}">Escolher arquivo</button>
        ${hasCustom ? `<button class="reset" data-reset="${key}">Restaurar</button>` : ''}
      </div>
    </div>`;
  });
  h += `<div class="grp-label">Mapas</div>`;
  MAPS.forEach(m=>{
    const key = 'map:'+m.id;
    const hasCustom = !!state.customIcons[key];
    h += `
    <div class="icon-row">
      <div class="preview">${getMapIconHtml(m.id,40)}</div>
      <div class="name">${m.name}</div>
      <div class="row-actions">
        <button data-choose="${key}">Escolher arquivo</button>
        ${hasCustom ? `<button class="reset" data-reset="${key}">Restaurar</button>` : ''}
      </div>
    </div>`;
  });
  body.innerHTML = h;

  body.querySelectorAll('[data-choose]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      pendingIconKey = btn.dataset.choose;
      iconFileInput.click();
    });
  });
  body.querySelectorAll('[data-reset]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      delete state.customIcons[btn.dataset.reset];
      saveIcons(); renderIconPanel(); render();
    });
  });
}

iconFileInput.addEventListener('change', ()=>{
  const file = iconFileInput.files[0];
  if(!file || !pendingIconKey) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    state.customIcons[pendingIconKey] = reader.result;
    saveIcons();
    renderIconPanel();
    render();
    pendingIconKey = null;
  };
  reader.readAsDataURL(file);
  iconFileInput.value = '';
});

function openIconPanel(){ iconPanelOverlay.classList.remove('hidden'); renderIconPanel(); }
function closeIconPanel(){ iconPanelOverlay.classList.add('hidden'); }
iconPanelOverlay.addEventListener('click', (e)=>{ if(e.target===iconPanelOverlay) closeIconPanel(); });
document.getElementById('close-icon-panel').addEventListener('click', closeIconPanel);

document.addEventListener('keydown', (e)=>{
  if(e.key==='/' && document.activeElement.tagName!=='INPUT'){
    e.preventDefault();
    setTimeout(()=>{ const s=document.getElementById('search'); if(s) s.focus(); }, 0);
  }
});

loadState();
</script>
